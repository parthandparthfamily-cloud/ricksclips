<!doctype html><html><body style="margin:0;background:#f0c35a"><canvas id="c" width="2400" height="1500"></canvas>
<script type="module">
import * as T from './toon.js';
const CAST = {

  waiter: { outfit: "waiter", hat: "slick", hair: "#2a211d", moustache: "#2a211d", top: "#26232b", bow: "#d6333c" },

const g = document.getElementById('c').getContext('2d');
const rows = [
  [['hero', {expr:'grin', L:'wave'}], ['hero', {expr:'nervous'}], ['carer', {expr:'smile', R:'wave'}], ['hair', {expr:'beam', R:'holdUp', propR:'scissors'}], ['hair', {expr:'smile', pose:'sit'}], ['waiter', {expr:'smugsmile', R:'holdUp', propR:'tray'}], ['cashier', {expr:'grin', R:'wave'}]],
